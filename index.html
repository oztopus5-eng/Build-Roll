<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Build Roll</title>
<meta name="theme-color" content="#1a1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Build Roll">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a living pixel panorama fills the screen; slim tab bar; dark glass panels float over the world. One committed look. */
:root{
  color-scheme: dark;
  --glass: rgba(12,10,20,.7);
  --ink:#f3f1f7; --muted:#b4aec4;
  --outline:#050507;
  --gold:#ffd23a;
  --accent:#8fd3ff;
  --f-display:"Silkscreen","Courier New",monospace;
  --f-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --cell:88px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:#1a1626;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.35;overflow-x:hidden}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:62;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.4) 100%)}
.page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* rarity tokens */
[data-r="C"]{--rc:#d8d8d8}
[data-r="U"]{--rc:#5fe05f}
[data-r="R"]{--rc:#4fa8ff}
[data-r="E"]{--rc:#c35cff}
[data-r="L"]{--rc:#ffb52e}
[data-r="M"]{--rc:#ff4f8b}
[data-r="X"]{--rc:#8ef6ff}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes rainbowBorder{0%,100%{border-color:#ff4f4f}20%{border-color:#ffd23a}40%{border-color:#4fff8a}60%{border-color:#4fa8ff}80%{border-color:#c35cff}}
@keyframes cosmicBorder{0%,100%{border-color:#8ef6ff;box-shadow:0 0 26px -4px #8ef6ff}33%{border-color:#b28aff;box-shadow:0 0 26px -4px #b28aff}66%{border-color:#ffffff;box-shadow:0 0 30px -4px #ffffff}}
@keyframes cosmicBg{to{background-position:200% 0}}

/* ---------- bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;justify-content:center;align-items:center;padding:12px 16px;gap:10px}
.tabs{display:flex;gap:8px;background:rgba(8,6,14,.6);border:3px solid var(--outline);padding:5px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tab{cursor:pointer;border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:1px;padding:9px 22px;min-height:42px}
.tab:hover{color:#fff}
.tab[aria-pressed="true"]{background:#fff;color:#0c0a12;box-shadow:inset -3px -3px 0 #bdb8c8}
.bar .sound{position:absolute;right:16px;top:50%;transform:translateY(-50%)}
.bar .sound:active{transform:translateY(-48%)}

/* ---------- buttons ---------- */
.mc-btn{--bt:var(--tex-btn);position:relative;cursor:pointer;border:3px solid var(--outline);background-color:#6f6f6f;background-image:var(--bt);background-size:72px;image-rendering:pixelated;color:#fff;text-shadow:2px 2px 0 #2b2b2b;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.5px;padding:10px 16px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -4px 0 rgba(0,0,0,.45);user-select:none;-webkit-user-select:none;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:filter .1s}
.mc-btn:hover{filter:brightness(1.12);outline:3px solid #fff;outline-offset:-3px}
.mc-btn:active{box-shadow:inset 3px 4px 0 rgba(0,0,0,.45),inset -3px -3px 0 rgba(255,255,255,.3);transform:translateY(2px)}
.mc-btn:disabled{cursor:not-allowed;filter:grayscale(1) brightness(.6);outline:none}
.mc-btn.green{--bt:var(--tex-emerald)}
.mc-btn.red{--bt:var(--tex-redstone)}
.mc-btn.icon{padding:8px 10px;min-width:44px}
.mc-btn svg{display:block}
.roll{display:flex;margin:22px auto 0;font-size:clamp(22px,3.4vw,30px);padding:18px 64px;min-height:72px;letter-spacing:3px;overflow:hidden}
.roll::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep 2.8s ease-in-out infinite}
.roll:disabled::after{display:none}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}

/* ---------- panels ---------- */
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:6px 48px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:3px solid var(--outline);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),0 10px 0 rgba(0,0,0,.28);padding:22px;position:relative}
.view{display:flex;flex-direction:column;gap:20px}

/* ---------- reels ---------- */
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.reel{display:flex;flex-direction:column;gap:8px;min-width:0}
.reel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reel-label{font-family:var(--f-display);font-size:13px;color:var(--muted);letter-spacing:3px}
.lock{width:38px;height:34px;min-height:0;padding:0}
.lock svg{width:16px;height:16px}
.reel-win{--rc:#ffffff;position:relative;height:calc(var(--cell) * 1.9);overflow:hidden;cursor:pointer;border:3px solid var(--outline);background:#0b0a10;box-shadow:inset 0 0 0 3px #26232f,inset 0 0 0 6px #0b0a10;transition:box-shadow .3s}
.reel-win::before,.reel-win::after{content:"";position:absolute;left:0;right:0;height:32%;z-index:3;pointer-events:none}
.reel-win::before{top:0;background:linear-gradient(#0b0a10 10%,rgba(11,10,16,.1))}
.reel-win::after{bottom:0;background:linear-gradient(rgba(11,10,16,.1),#0b0a10 90%)}
.rays{position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(var(--rc) 0deg 9deg,transparent 9deg 22deg);opacity:0;z-index:0;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 6%,transparent 48%);mask:radial-gradient(circle,#000 6%,transparent 48%)}
[data-r="M"] > .rays,.rv-rays[data-r="M"],.bigrays[data-r="M"]{background:repeating-conic-gradient(#ff4f4f 0 8deg,transparent 8deg 15deg,#ffd23a 15deg 23deg,transparent 23deg 30deg,#4fff8a 30deg 38deg,transparent 38deg 45deg,#4fa8ff 45deg 53deg,transparent 53deg 60deg,#c35cff 60deg 68deg,transparent 68deg 75deg)}
[data-r="X"] > .rays,.rv-rays[data-r="X"],.bigrays[data-r="X"]{background:repeating-conic-gradient(#8ef6ff 0 5deg,transparent 5deg 12deg,#ffffff 12deg 15deg,transparent 15deg 22deg,#b28aff 22deg 28deg,transparent 28deg 36deg)}
.reel-win.glow{box-shadow:inset 0 0 0 3px var(--rc),inset 0 0 0 6px #0b0a10,0 0 22px -4px var(--rc)}
.reel-win.glow .rays{opacity:.2;animation:rspin 10s linear infinite}
.reel-win.hit .rays{animation:rhit 1.6s ease-out,rspin 10s linear infinite}
.reel-win.spinning{box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 6px #0b0a10,0 0 18px -6px var(--accent)}
.reel-win.jack{animation:jack .5s ease-in-out 4}
@keyframes jack{50%{transform:scale(1.05);box-shadow:inset 0 0 0 4px #fff,0 0 40px var(--rc)}}
@keyframes rspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes rhit{0%{opacity:0}12%{opacity:.95}100%{opacity:.2}}
.mark{position:absolute;left:6px;right:6px;top:50%;height:var(--cell);transform:translateY(-50%);z-index:4;pointer-events:none;border-top:2px solid rgba(255,255,255,.1);border-bottom:2px solid rgba(255,255,255,.1)}
.mark::before,.mark::after{content:"";position:absolute;top:50%;width:0;height:0;border:8px solid transparent;transform:translateY(-50%)}
.mark::before{left:-6px;border-left-color:var(--accent)}
.mark::after{right:-6px;border-right-color:var(--accent)}
.strip{position:absolute;left:0;right:0;top:0;z-index:1;will-change:transform}
.cell{position:relative;height:var(--cell);display:flex;align-items:center;gap:14px;padding:0 18px;color:#fff;min-width:0}
.cell::before{content:"";position:absolute;inset:8px 6px;background:linear-gradient(90deg,var(--rc),transparent 85%);opacity:.16;pointer-events:none}
.cell::after{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:4px;background:var(--rc)}
.cell[data-r="C"]::before,.cell[data-r="C"]::after{display:none}
.cell[data-r="X"]::before{background:linear-gradient(90deg,#8ef6ff,#b28aff 40%,transparent 85%);opacity:.3}
.cell .txt{position:relative;min-width:0;font-family:var(--f-display);font-weight:700;font-size:clamp(15px,2.1vw,22px);line-height:1.05;text-shadow:2px 2px 0 #000;overflow-wrap:anywhere}
.cell .sw{position:relative;width:46px;height:46px;flex:none;border:3px solid #000;background-size:cover;image-rendering:pixelated;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.3)}
.reel.locked .reel-win{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 6px #0b0a10}
.reel.landed .reel-win{animation:land .7s ease-out}
@keyframes land{0%{transform:scale(1.06);filter:brightness(2)}100%{transform:scale(1);filter:none}}
.rpop{position:absolute;left:50%;top:50%;z-index:6;font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,34px);color:var(--rc);text-shadow:0 3px 0 #000,0 0 18px var(--rc);transform:translate(-50%,-50%);pointer-events:none;animation:rpop 1.6s ease-out forwards;white-space:nowrap}
.rpop[data-r="M"]{animation:rpop 1.6s ease-out forwards,hue .6s linear infinite}
.rpop[data-r="X"]{background:linear-gradient(90deg,#8ef6ff,#fff,#b28aff,#8ef6ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 12px #8ef6ff);animation:rpop 1.8s ease-out forwards,cosmicBg 1s linear infinite}
@keyframes rpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}14%{transform:translate(-50%,-50%) scale(1.4);opacity:1}28%{transform:translate(-50%,-50%) scale(1)}70%{opacity:1;transform:translate(-50%,-85%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(.9)}}

/* ---------- prompt ---------- */
.readout{margin-top:22px;border:3px solid var(--outline);background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.35));padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 22px;align-items:end}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.6vw,48px);line-height:1.05;margin:8px 0 12px;text-wrap:balance;text-shadow:3px 3px 0 #000}
.prompt .p-theme{color:var(--accent);transition:color .6s}
.prompt .p-type{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 10px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);color:#eee;font-size:15px}
.readout .acts{display:flex;gap:10px;flex-wrap:wrap}
.rbadge{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:1px;padding:3px 8px;color:#000;background:var(--rc);border:2px solid #000;text-shadow:none;white-space:nowrap}
.rbadge[data-r="M"]{background:linear-gradient(90deg,#ff4f4f,#ffd23a,#4fff8a,#4fa8ff,#c35cff,#ff4f4f);background-size:200% 100%;animation:cosmicBg 2s linear infinite}
.rbadge[data-r="X"]{background:linear-gradient(90deg,#1a1a6a,#8ef6ff,#ffffff,#b28aff,#1a1a6a);background-size:200% 100%;animation:cosmicBg 1.6s linear infinite}

/* ---------- post ---------- */
.post{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:center}
.frame{position:relative;aspect-ratio:4/3;max-width:100%;cursor:pointer;border:3px solid var(--outline);background-color:#7a5a32;background-image:var(--tex-planks);background-size:54px;image-rendering:pixelated;padding:14px;box-shadow:inset 4px 4px 0 rgba(255,255,255,.22),inset -4px -4px 0 rgba(0,0,0,.4)}
.frame-in{width:100%;height:100%;background:#2a2016;border:3px solid #1a120a;box-shadow:inset 0 0 22px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#e9dcc0;text-align:center;font-size:16px;padding:10px;overflow:hidden;position:relative;transition:background .2s}
.frame:hover .frame-in{background:#33281c}
.frame-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.frame.drag{outline:4px dashed var(--gold);outline-offset:-12px}
.plus{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold);text-shadow:3px 3px 0 #000}
.fields{display:flex;flex-direction:column;gap:12px;min-width:0}
.mc-input{width:100%;background:rgba(0,0,0,.75);color:#fff;border:3px solid #5a5666;padding:10px 12px;font-size:17px;font-family:var(--f-body);border-radius:0;min-height:48px}
.mc-input::placeholder{color:#8a8498}
.mc-input:focus{border-color:#fff;outline:none}
select.mc-input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px;width:auto}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid #000;background:#2b2735;color:#eee;font-size:14px;white-space:nowrap;cursor:default}
button.tag{cursor:pointer;font:inherit;font-size:14px}
button.tag:hover{background:#3b3548}
.tag i{width:10px;height:10px;display:inline-block;border:1px solid #000}
.status{font-size:15px;min-height:1.3em;color:var(--muted)}
.status.err{color:#ff8a7a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- gallery ---------- */
.gal-top{display:flex;gap:10px;align-items:stretch}
.searchbox{position:relative;flex:1;min-width:0}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.searchbox .mc-input{padding-left:44px;min-height:52px;font-size:18px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#0e0c16;border:3px solid #000;box-shadow:0 10px 0 rgba(0,0,0,.35);max-height:340px;overflow:auto}
.sugg button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:none;border:0;border-bottom:2px solid #1c1926;color:#fff;cursor:pointer;text-align:left;font-size:16px}
.sugg button:hover,.sugg button.on{background:#221e30}
.sugg small{color:var(--muted);font-family:var(--f-display);font-size:11px;letter-spacing:1px}
.rchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rchip{cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;background:rgba(0,0,0,.45);border:2px solid #000;color:#ddd;font-family:var(--f-display);font-size:12px;letter-spacing:1px;min-height:36px}
.rchip i{width:10px;height:10px;background:var(--rc,#fff);border:1px solid #000;display:inline-block}
.rchip b{font-weight:400;color:var(--muted)}
.rchip[aria-pressed="true"]{background:#fff;color:#0c0a12}
.rchip[aria-pressed="true"] b{color:#555}
.active{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.active:empty{display:none}
.pill{cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:5px 10px;background:var(--accent);color:#000;border:2px solid #000;font-weight:600;font-size:15px}
.pill span{font-family:var(--f-display);font-size:11px}
.gal-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 12px;font-size:15px;color:var(--muted)}
.gal-meta strong{font-family:var(--f-display);color:#fff;font-weight:700;letter-spacing:1px;font-size:13px}

.spot{position:relative;overflow:hidden;margin-top:18px;border:3px solid var(--rc);background:#0d0b14;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);box-shadow:0 0 30px -8px var(--rc)}
.spot .rays{opacity:.18;width:200%;animation:rspin 30s linear infinite}
.spot[data-r="M"]{animation:rainbowBorder 3s linear infinite}
.spot[data-r="X"]{animation:cosmicBorder 3s linear infinite}
.spot-img{position:relative;z-index:1;aspect-ratio:16/10;max-width:100%;cursor:pointer;overflow:hidden;background:#000}
.spot-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.spot-img:hover img{transform:scale(1.04)}
.spot-info{position:relative;z-index:1;padding:22px;display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
.spot-info h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.1;text-shadow:2px 2px 0 #000;overflow-wrap:anywhere}
.who{font-size:15px;color:var(--muted)}
.spot-info .rbadge,.lb-side .rbadge{align-self:flex-start}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;perspective:900px}
.card{--rc:#2e2a3a;position:relative;cursor:pointer;border:3px solid var(--rc);background:#14111c;display:flex;flex-direction:column;color:#fff;transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .2s;outline:3px solid #000;animation:cardUp .45s ease-out both}
.card[data-r="C"]{--rc:#3a3646}
.card[data-r="L"]{box-shadow:0 0 20px -4px var(--rc)}
.card[data-r="M"]{animation:cardUp .45s ease-out both,rainbowBorder 3s linear infinite;box-shadow:0 0 22px -4px #ff4f8b}
.card[data-r="X"]{animation:cardUp .45s ease-out both,cosmicBorder 3s linear infinite}
@keyframes cardUp{from{transform:translateY(14px)}to{transform:none}}
.card .ph{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:#000}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 46%,transparent 62%);background-size:260% 260%;background-position:var(--mx,50%) 50%;mix-blend-mode:overlay;transition:opacity .25s}
.card[data-r="R"] .ph::after{opacity:.35}
.card[data-r="E"] .ph::after,.card[data-r="L"] .ph::after{opacity:.7}
.card[data-r="M"] .ph::after,.card[data-r="X"] .ph::after{opacity:.75;background:linear-gradient(115deg,rgba(255,79,79,.35),rgba(255,210,58,.35),rgba(79,255,138,.35),rgba(79,168,255,.35),rgba(195,92,255,.35),rgba(255,79,79,.35));background-size:300% 300%;mix-blend-mode:color-dodge}
.card:hover .ph::after{opacity:1}
.card .ph .rbadge{position:absolute;top:8px;left:8px;z-index:2}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15;overflow-wrap:anywhere;text-shadow:2px 2px 0 #000}
.card .sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.heart{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;font-size:15px;min-height:32px}
.heart svg path{fill:#5a5468}
.heart.on{color:#ff6a8a}
.heart.on svg path{fill:#ff4f6a}
.heart:hover svg path{fill:#ff8aa0}
.heart.pop svg{animation:hpop .4s ease-out}
@keyframes hpop{40%{transform:scale(1.6)}}
.empty{grid-column:1/-1;text-align:center;padding:44px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty canvas{width:96px;height:78px;image-rendering:pixelated}
.empty h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;text-shadow:2px 2px 0 #000}
.empty p{margin:0;max-width:44ch;color:var(--muted)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:58;background:rgba(6,5,10,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.lb-box{position:relative;width:min(1080px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:0;background:#0d0b14;border:3px solid var(--rc,#2e2a3a);box-shadow:0 0 40px -10px var(--rc,#000)}
.lb-box[data-r="M"]{animation:rainbowBorder 3s linear infinite}
.lb-box[data-r="X"]{animation:cosmicBorder 3s linear infinite}
.lb-img{background:#000;display:flex;align-items:center;justify-content:center;min-height:240px;position:relative}
.lb-img img{max-width:100%;max-height:80vh;display:block}
.lb-side{display:flex;flex-direction:column;gap:14px;min-width:0;padding:24px}
.lb-side h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;overflow-wrap:anywhere;text-shadow:2px 2px 0 #000}
.lb-side .acts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.lb-x{position:absolute;top:10px;right:10px;z-index:3}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3}
.lb-prev{left:10px}.lb-next{right:10px}

/* ---------- celebration layers ---------- */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);right:16px;z-index:70;width:min(340px,calc(100vw - 32px));background:#212121;border:3px solid #000;box-shadow:inset 3px 3px 0 #555,inset -3px -3px 0 #0b0b0b;padding:10px 12px;display:flex;gap:12px;align-items:center;transform:translateX(130%);transition:transform .35s steps(6)}
.toast.show{transform:none}
.toast .ic{width:42px;height:42px;flex:none;background-image:var(--tex-grass-side);background-size:cover;border:3px solid #000;image-rendering:pixelated}
.toast .tt{font-family:var(--f-display);color:#ffff4a;font-size:14px}
.toast .tb{color:#fff;font-size:15px}
.flash{--fc:#ffd23a;position:fixed;left:50%;top:44%;z-index:66;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:clamp(36px,9vw,96px);color:var(--fc);text-shadow:0 5px 0 rgba(0,0,0,.6),0 10px 0 rgba(0,0,0,.35),0 0 34px var(--fc);transform:translate(-50%,-50%) scale(.2);opacity:0;white-space:nowrap}
.flash.go{animation:flash 1.5s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(3deg)}28%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%) scale(1)}}
.bigrays{--rc:#4fa8ff;position:fixed;left:50%;top:44%;width:220vmax;height:220vmax;z-index:61;pointer-events:none;opacity:0;transform:translate(-50%,-50%);background:repeating-conic-gradient(var(--rc) 0deg 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 4%,transparent 45%);mask:radial-gradient(circle,#000 4%,transparent 45%)}
.bigrays.go{animation:bigr 2.4s ease-out forwards}
@keyframes bigr{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.6)}15%{opacity:.55}100%{opacity:0;transform:translate(-50%,-50%) rotate(70deg) scale(1)}}
.wflash{position:fixed;inset:0;z-index:67;background:#fff;opacity:0;pointer-events:none}
.wflash.go{animation:wf .8s ease-out}
@keyframes wf{0%{opacity:.9}100%{opacity:0}}
.rv-back{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 46%,rgba(10,6,20,.55),rgba(0,0,0,.92));overflow:hidden;animation:fadeIn .25s ease-out}
.rv-rays{position:absolute;left:50%;top:46%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(var(--rc) 0 6deg,transparent 6deg 15deg);-webkit-mask:radial-gradient(circle,#000 3%,transparent 42%);mask:radial-gradient(circle,#000 3%,transparent 42%);opacity:.55;animation:rspin2 14s linear infinite}
@keyframes rspin2{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}}
.rv-wrap{position:fixed;left:50%;top:46%;z-index:64;transform:translate(-50%,-50%);perspective:900px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px);cursor:pointer}
.rv-card{position:relative;padding:30px 28px 28px;text-align:center;background:linear-gradient(180deg,#171326,#0a0812);border:4px solid var(--rc);box-shadow:0 0 0 4px #000,0 0 70px var(--rc),inset 0 0 40px rgba(0,0,0,.6);overflow:hidden;animation:cardIn 1s cubic-bezier(.2,1.3,.35,1) both}
.rv-card[data-r="M"]{animation:cardIn 1s cubic-bezier(.2,1.3,.35,1) both,rainbowBorder 2s linear infinite}
.rv-card[data-r="X"]{background:radial-gradient(circle at 50% 0%,#2a1a6a,#07051a 70%);animation:cardIn 1.2s cubic-bezier(.2,1.3,.35,1) both,cosmicBorder 2s linear infinite}
.rv-card::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 2.2s ease-in-out .9s infinite}
@keyframes cardIn{0%{transform:scale(0) rotateY(540deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotateY(0)}}
.rv-kicker{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:4px;color:#fff;opacity:.85}
.rv-tier{overflow-wrap:normal;word-break:keep-all;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,10vw,86px);line-height:1;margin:8px 0 14px;color:var(--rc);text-shadow:0 5px 0 #000,0 0 30px var(--rc)}
.rv-tier[data-r="M"]{animation:hue 1s linear infinite}
.rv-tier[data-r="X"]{background:linear-gradient(90deg,#8ef6ff,#ffffff,#b28aff,#8ef6ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 20px #8ef6ff);animation:cosmicBg 1.2s linear infinite}
.rv-prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,3.4vw,28px);line-height:1.15;color:#fff;text-shadow:2px 2px 0 #000;text-wrap:balance}
.rv-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.page.shake1{animation:sh1 .45s steps(9)}
.page.shake2{animation:sh2 .8s steps(16)}
.page.shake3{animation:sh2 1.4s steps(28)}
@keyframes sh1{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
@keyframes sh2{0%,100%{transform:none}10%{transform:translate(-10px,6px)}20%{transform:translate(9px,-7px)}30%{transform:translate(-8px,-5px)}40%{transform:translate(8px,6px)}50%{transform:translate(-6px,4px)}60%{transform:translate(5px,-4px)}70%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}90%{transform:translate(-2px,1px)}}

@media (max-width:860px){
  .post{grid-template-columns:minmax(0,1fr)}
  .lb-box{grid-template-columns:minmax(0,1fr)}
  .readout{grid-template-columns:minmax(0,1fr)}
  .spot{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  :root{--cell:66px}
  .reels{grid-template-columns:minmax(0,1fr);gap:12px}
  .reel-win{height:calc(var(--cell) * 1.6)}
  .panel{padding:16px 14px}
  .bar{justify-content:flex-start}
  .tab{padding:9px 14px}
  .gal-top{flex-wrap:wrap}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card .t{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .card,.rv-card,.page.shake1,.page.shake2,.page.shake3,.bigrays.go,.rv-rays,.roll::after{animation:none!important}
  .reel-win.glow .rays,.reel-win.hit .rays{animation:none}
  .flash.go{animation-duration:.01s}
  .toast{transition:none}
}
</style>
</head>

        <div class="active" id="active"></div>
        <div id="spot"></div>
        <div class="gal-meta"><strong id="count">Loading builds…</strong><span id="modeNote"></span></div>
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>
</div>

</div>

function genScene(t){

  const mk=()=>{const cv=document.createElement('canvas');cv.width=LW;cv.height=lh;return[cv,cv.getContext('2d')]};

  else for(let x=0;x<LW;x++){const y=Math.round(lh*.6+r2(x));P(f,x,y,1,lh-y,c2)}
  if(t.extra){const ex=Math.floor(LW*(.45+r()*.3));EXTRA[t.extra](f,ex,Math.round(t.sea?lh*.65:lh*.6+r2(ex)+2),shade(c2,-.25))}
  if(t.tree==='tower'){for(let i=0;i<LW;i+=7+Math.floor(r()*6)){const h=10+Math.floor(r()*28),w=4+Math.floor(r()*5);P(f,i,Math.round(lh*.62)-h,w,h+40,shade(t.far,-.2));for(let k=0;k<h/3;k++)if(r()<.4)P(f,i+1+Math.floor(r()*(w-2)),Math.round(lh*.62)-h+2+k*3,1,1,r()<.6?'#2fb8c8':'#b83fa8')}}
  if(t.rays){f.globalAlpha=.08;for(let k=0;k<7;k++){const x0=Math.floor(r()*LW);for(let j=0;j<lh*.7;j++)P(f,x0+j*.4,j,6,1,'#cff6ff')}f.globalAlpha=1}
  if(t.ceil){const cc=tileH(r,[3,7,13],lh*.05);const ceil=mixHex(t.ceil,t.sky[0],.3);for(let x=0;x<LW;x++){const y=Math.round(lh*.1+cc(x));P(f,x,0,1,y,ceil);if(x%11===0&&r()<.7){const d=3+Math.floor(r()*7);for(let j=0;j<d;j++)P(f,x,y+j,Math.max(1,3-Math.floor(j/2)),1,ceil)}if(t.berries&&x%9===0&&r()<.6){const d=4+Math.floor(r()*14);P(f,x,y,1,d,'#3f7a2a');P(f,x,y+d,1,1,'#ffb84a')}if(r()<.03)P(f,x,y-1,2,1,t.c)}}
  const[mc,m]=mk();
  if(t.islands){
    for(let i=0;i<4;i++){const cx=Math.floor((i+.3+r()*.4)*LW/4),cy=Math.round(lh*(.35+r()*.25)),w=18+Math.floor(r()*16);
      for(let j=0;j<w/2;j++){const ww=w-j*2-Math.floor(r()*2);if(ww<1)break;wrap(xx=>P(m,xx-Math.floor(ww/2),cy+j,ww,1,j===0?t.top:j<3?t.body:'#7e7e7e'),cx)}
      wrap(xx=>TREES.oak(m,xx-2,cy,r),cx);wrap(xx=>DECO.flowers(m,xx+5,cy,r),cx)}

    const hm=tileH(r,[2,4,7],lh*.05);const base=lh*.74;

    let x=Math.floor(r()*14);while(x<LW){const y=Math.round(base+hm(x));wrap(xx=>TREES[t.tree](m,xx,y,r),x);x+=16+Math.floor(r()*22)}
  }
  const[nc,n]=mk();
  if(!t.islands){
    if(t.sea){const by=Math.round(lh*.88);P(n,0,by,LW,lh,'#2a6fb0');for(let x=0;x<LW;x+=2)P(n,x,by+Math.round(Math.sin(x*.3)),2,1,'#7fc4ee');for(let k=0;k<50;k++)P(n,Math.floor(r()*LW),by+3+Math.floor(r()*12),4,1,'#3f88c8')}
    else{const hm=tileH(r,[3,8],lh*.012);const base=lh*.89;const nt=t.snowcap?'#ffffff':shade(t.top,-.05),nb=shade(t.body,-.12);
      for(let x=0;x<LW;x++){const y=Math.round(base+hm(x));P(n,x,y,1,lh-y,nb);P(n,x,y,1,3,nt);if(r()<.5)P(n,x,y+1+Math.floor(r()*2),1,1,shade(nt,-.12));if(r()<.2)P(n,x,y+4+Math.floor(r()*8),1,1,shade(nb,-.2))}
      let x=Math.floor(r()*6);while(x<LW){const y=Math.round(base+hm(x));wrap(xx=>DECO[t.deco](n,xx,y,r),x);x+=5+Math.floor(r()*12)}
      if(t.deco==='lava'){P(n,0,lh-3,LW,3,'#ff6a10');for(let x=0;x<LW;x+=3)P(n,x,lh-3,1,1,'#ffd36b')}}
  }

}

    spot.innerHTML=`<div class="spot" data-r="${rt}"><div class="rays"></div><div class="spot-img" data-open="${esc(best.id)}"><img alt="${esc(best.title||promptText(best))}" src="${best.thumb||''}"></div><div class="spot-info">${badge(rt)}<h3>${esc(best.title||promptText(best))}</h3><div class="row">${tagHTML(best,true)}</div><div class="who">${esc(best.player||'Anonymous builder')} · ${ago(best.createdAt)}</div><div class="row">${heartBtn(best)}<button class="mc-btn green" data-buildthis="${esc(best.id)}">Build this prompt</button></div></div></div>`}
  else spot.innerHTML='';
  if(!list.length){const none=all.length===0;grid.innerHTML=`<div class="empty"><canvas width="21" height="17" id="chest"></canvas><h3>${none?'No builds yet':'Nothing matches'}</h3><p>${none?'Roll a prompt, build it, then post a screenshot. Every build lands here with its theme, type and size.':'Try a different word or clear the filters.'}</p>${none?'<button class="mc-btn green" id="emptyGo">Roll a prompt</button>':''}</div>`;drawChest($('chest'));if(none)$('emptyGo').onclick=()=>go('create');return}
  grid.innerHTML=list.map(cardHTML).join('');
}
$('spot').addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o)openBuild(o.dataset.open);const bt=e.target.closest('[data-buildthis]');if(bt)buildThis(bt.dataset.buildthis)});
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openBuild(c.dataset.id)});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openBuild(e.target.dataset.id)}});
if(!REDUCE){
  $('grid').addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c||e.pointerType==='touch')return;const r=c.getBoundingClientRect();const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;c.style.transform=`rotateY(${(px-.5)*14}deg) rotateX(${(.5-py)*12}deg) translateZ(10px)`;c.style.setProperty('--mx',`${Math.round(px*100)}%`)});
  $('grid').addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.transform='';c.style.removeProperty('--mx')}});
}
function drawChest(c){if(!c)return;const x=c.getContext('2d');const Pc={K:'#1a0f04',B:'#8a5a28',L:'#a8743a',G:'#c9c9c9',D:'#5c3a16'};["KKKKKKKKKKKKKKKKKKKKK","KLLLLLLLLLLLLLLLLLLLK","KLBBBBBBBBBBBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KKKKKKKKKGGGKKKKKKKKK","KDDDDDDDDGKGDDDDDDDDK","KLBBBBBBBGGGBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KLBBBBBBBBBBBBBBBBBLK","KLDDDDDDDDDDDDDDDDDLK","KDDDDDDDDDDDDDDDDDDDK","KKKKKKKKKKKKKKKKKKKKK"].forEach((r,j)=>[...r].forEach((ch,i)=>{x.fillStyle=Pc[ch];x.fillRect(i,j,1,1)}))}

let openId=null,ambBefore=null;
async function openBuild(id){
  const b=allBuilds().find(x=>x.id===id);if(!b)return;if(openId===null)ambBefore=ambT;openId=id;SFX.page();setAmbient(themeByName(b.theme));
  const rt=rollTier(b),box=$('lbBox');box.dataset.r=rt;box.style.setProperty('--rc',RAR[rt].c);
  $('lbBadge').innerHTML=badge(rt)+(isTriple(b)?' <span class="rbadge" style="background:#ffd23a">TRIPLE</span>':'');
  $('lbTitle').textContent=b.title||promptText(b);$('lbTags').innerHTML=tagHTML(b,true);$('lbWho').textContent=`Built by ${b.player||'Anonymous builder'} · ${ago(b.createdAt)}`;
  $('lbHeart').innerHTML=heartBtn(b);
  $('lbImg').innerHTML=`<img alt="${esc(b.title||promptText(b))}" src="${b.thumb||''}">`;
  const del=$('lbDel');del.hidden=!(b.ownerId===myId||isOwner);del.textContent=b.ownerId===myId?'Delete my build':'Delete build';del.dataset.armed='';
  const idx=lbList.findIndex(x=>x.id===id);$('lbPrev').hidden=idx<=0;$('lbNext').hidden=idx<0||idx>=lbList.length-1;
  $('lb').hidden=false;$('lbClose').focus();
  let full=null;try{if(mode==='live'){const s=await rdb.ref('buildroll/photos/'+id).get();full=s.exists()?s.val().img:null}else full=localPhotos[id]}catch(e){}
  if(openId===id&&full)$('lbImg').innerHTML=`<img alt="${esc(b.title||promptText(b))}" src="${full}">`;
}
function stepLb(d){const idx=lbList.findIndex(x=>x.id===openId);const n=lbList[idx+d];if(n)openBuild(n.id)}
$('lbPrev').onclick=()=>stepLb(-1);$('lbNext').onclick=()=>stepLb(1);
function closeLb(){$('lb').hidden=true;openId=null;if(ambBefore)setAmbient(ambBefore);ambBefore=null}
$('lbClose').onclick=closeLb;$('lb').addEventListener('click',e=>{if(e.target===$('lb'))closeLb()});
addEventListener('keydown',e=>{if(!$('rvWrap').hidden&&(e.key==='Escape'||e.key==='Enter')){closeReveal();return}if($('lb').hidden)return;if(e.key==='Escape')closeLb();else if(e.key==='ArrowLeft')stepLb(-1);else if(e.key==='ArrowRight')stepLb(1)});
function buildThis(id){const b=allBuilds().find(x=>x.id===id);if(!b)return;state={theme:b.theme,type:b.type,size:b.size};store.set('roll',state);ambBefore=null;if(!$('lb').hidden)closeLb();go('create');reelEls.forEach((_,i)=>restStrip(i));renderPrompt();SFX.finale('U');showFlash('YOUR TURN!',null)}
$('lbRoll').onclick=()=>buildThis(openId);
$('lbDel').onclick=async()=>{const del=$('lbDel');if(!del.dataset.armed){del.dataset.armed='1';del.textContent='Tap again to delete';SFX.err();return}const id=openId;try{if(mode==='live'){await rdb.ref('buildroll/builds/'+id).remove();await rdb.ref('buildroll/photos/'+id).remove()}else{localBuilds=localBuilds.filter(b=>b.id!==id);delete localPhotos[id];renderGallery()}closeLb();toast('Build deleted','It\'s gone from the gallery.')}catch(e){del.textContent='Couldn\'t delete. Try again.';del.dataset.armed=''}};

/* ================= NAV / TOAST ================= */
let toastT;function toast(t,b){$('toastT').textContent=t;$('toastB').textContent=b;const el=$('toast');el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}
function go(page){
  const c=page!=='gallery';$('viewCreate').hidden=!c;$('viewGallery').hidden=c;$('navCreate').setAttribute('aria-pressed',c);$('navGallery').setAttribute('aria-pressed',!c);
  try{history.replaceState(null,'','#'+(c?'create':'gallery'))}catch(e){}SFX.page();
  if(c){setAmbient(themeByName(state.theme));reelEls.forEach((_,i)=>{if(!spinning[i])reelEls[i].strip.style.transform=`translateY(${centerY(i,1)}px)`})}else{renderGallery();ambientForGallery()}
}
boot();
$('navCreate').onclick=()=>go('create');$('navGallery').onclick=()=>go('gallery');
if(location.hash==='#gallery'){$('viewCreate').hidden=true;$('viewGallery').hidden=false;$('navCreate').setAttribute('aria-pressed','false');$('navGallery').setAttribute('aria-pressed','true');renderGallery();setAmbient(DAY)}
else setAmbient(themeByName(state.theme));
fadeF=1;scenePrev=null;
requestAnimationFrame(frame);
})();
</script>
